<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="arm-enabled" content="__ARM_ENABLED__">
  <title>Arm + Band</title>
  <link rel="stylesheet" href="/dashboard.css">
  <script src="/dashboard.js" defer></script>
</head>
<body>
  <main>
    <section>
      <header><h2>Arm</h2><span id="arm-status" class="status">—</span></header>
      <svg id="side-view" viewBox="-300 -370 600 390" role="img" aria-label="Arm side view">
        <line class="floor" x1="-290" y1="0" x2="290" y2="0"/>
        <polyline id="trail" class="trail" points=""/>
        <polyline id="links" class="links" points=""/>
        <circle id="tip" class="tip" r="6" cx="0" cy="-28"/>
      </svg>
      <ul id="joints" class="joints"></ul>
      <p class="note">0° = arm pointing straight up (config/arm_home.json)</p>
    </section>

    <section>
      <header><h2>EMG</h2><span id="band-status" class="status">—</span></header>
      <canvas id="emg" aria-label="Raw EMG, 8 channels"></canvas>
      <header class="sub"><h2>Motion</h2><span id="gesture" class="status">no gestures yet</span></header>
      <canvas id="motion" aria-label="Wrist orientation and gyro"></canvas>
      <form id="url-form" hidden>
        <input id="stream-url" type="url" placeholder="Paste Kinesis stream URL" autocomplete="off" spellcheck="false">
      </form>
    </section>
  </main>
</body>
</html>
