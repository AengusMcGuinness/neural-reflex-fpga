<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hand To Robot</title>
<style>
  :root { color-scheme: light dark; font-family: system-ui, -apple-system, sans-serif;
    --bg: #fafafa; --text: #111; --muted: #888; --line: #e5e5e5; --arm: #111; --target: #2563eb; --moved: #dc2626; --safe: #16a34a; }
  @media (prefers-color-scheme: dark) { :root { --bg: #0a0a0a; --text: #eee; --muted: #777; --line: #262626; --arm: #eee;
    --target: #60a5fa; --moved: #f87171; --safe: #4ade80; } }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); }
  main { max-width: 1100px; margin: 0 auto; padding: 32px 16px 48px; }
  h1 { margin: 0 0 4px; font-size: 1.1rem; font-weight: 600; }
  h2 { margin: 0 0 6px; font-size: .85rem; font-weight: 600; color: var(--muted); }
  .muted { color: var(--muted); font-size: .85rem; }
  .grid { display: grid; grid-template-columns: minmax(0, 2fr) minmax(0, 3fr); gap: 28px; margin-top: 20px; }
  @media (max-width: 820px) { .grid { grid-template-columns: minmax(0, 1fr); } }
  canvas { display: block; width: 100%; }
  #human, #robot { height: 380px; } .lane { height: 70px; margin-top: 4px; }
  .controls { display: flex; gap: 10px; align-items: center; margin-top: 14px; }
  .controls input { flex: 1; }
  button { font: inherit; font-size: .85rem; color: var(--text); background: none; border: 1px solid var(--line); border-radius: 6px; padding: 6px 12px; cursor: pointer; }
  .legend span { margin-right: 14px; font-size: .8rem; } .legend i { display: inline-block; width: 10px; height: 10px; border-radius: 50%; margin-right: 5px; vertical-align: -1px; }
</style>
</head>
<body>
<main>
  <h1>Your hand → SO-ARM101 gripper (one plane, dry run)</h1>
  <div class="muted" id="intro"></div>
  <div class="grid">
    <section><h2>You: hand relative to shoulder (arm lengths)</h2><canvas id="human"></canvas></section>
    <section><h2>Robot: mapped target and where its gripper gets</h2><canvas id="robot"></canvas>
      <div class="legend muted"><span><i style="background:var(--target)"></i>target from your hand</span>
        <span><i style="background:var(--arm)"></i>gripper tip</span><span><i style="background:var(--moved)"></i>target unreachable, moved</span></div></section>
  </div>
  <div class="controls"><button id="play" type="button">Pause</button><input id="scrub" type="range" min="0" value="0" aria-label="Time"><span id="clock" class="muted"></span></div>
  <h2 style="margin-top:18px">Gripper tip distance from base (cm)</h2><canvas id="lane-x" class="lane"></canvas>
  <h2 style="margin-top:10px">Gripper tip height (cm)</h2><canvas id="lane-z" class="lane"></canvas>
  <h2 style="margin-top:10px">Grip (EMG)</h2><canvas id="lane-g" class="lane"></canvas>
</main>
<script>
"use strict";
const D = __HAND_DATA__, N = D.target.length, G = D.geometry;
const css = n => getComputedStyle(document.documentElement).getPropertyValue(n);
const fit = c => { const d = devicePixelRatio || 1, w = Math.round(c.clientWidth * d), h = Math.round(c.clientHeight * d);
  if (c.width !== w || c.height !== h) { c.width = w; c.height = h; } return [c.getContext("2d"), w, h, d]; };
const movedPct = 100 * D.moved.filter(Boolean).length / N;
document.getElementById("intro").textContent =
  `${D.block} · calibrated from ${D.source} · target moved to nearest reachable point ${movedPct.toFixed(0)}% of the time`;
let index = 0, playing = true;

function chain(a) { const pts = [[G.shoulder_forward, G.shoulder_height]]; let h = 0;
  a.forEach((deg, i) => { h += deg * Math.PI / 180; const p = pts[pts.length - 1];
    pts.push([p[0] + G.links[i] * Math.sin(h), p[1] + G.links[i] * Math.cos(h)]); }); return pts; }

function drawHuman() {
  const [ctx, w, h, d] = fit(document.getElementById("human")); ctx.clearRect(0, 0, w, h);
  const s = Math.min(w / 1.5, h / 2.2), X = f => w * 0.22 + f * s, Y = u => h * 0.45 - u * s;
  const cal = D.human_calibration;
  ctx.strokeStyle = css("--line"); ctx.lineWidth = 2 * d;
  ctx.beginPath(); ctx.moveTo(0, Y(cal.table_up)); ctx.lineTo(w, Y(cal.table_up)); ctx.stroke();
  ctx.fillStyle = css("--safe"); ctx.globalAlpha = 0.35;
  ctx.fillRect(X(cal.forward_range[0]), Y(cal.table_up), (cal.forward_range[1] - cal.forward_range[0]) * s, 6 * d); ctx.globalAlpha = 1;
  ctx.fillStyle = css("--muted"); ctx.font = `${10 * d}px system-ui`; ctx.fillText("your table", X(-0.15), Y(cal.table_up) - 5 * d);
  ctx.beginPath(); ctx.arc(X(0), Y(0), 5 * d, 0, 7); ctx.fill(); ctx.fillText("shoulder", X(0) + 8 * d, Y(0) - 6 * d);
  ctx.strokeStyle = css("--muted"); ctx.lineWidth = d; ctx.beginPath();
  for (let i = Math.max(0, index - 150); i <= index; i++) { const [f, u] = D.human[i]; i === Math.max(0, index - 150) ? ctx.moveTo(X(f), Y(u)) : ctx.lineTo(X(f), Y(u)); }
  ctx.stroke();
  const [f, u] = D.human[index]; ctx.strokeStyle = css("--arm"); ctx.lineWidth = 6 * d; ctx.lineCap = "round";
  ctx.beginPath(); ctx.moveTo(X(0), Y(0)); ctx.lineTo(X(f), Y(u)); ctx.stroke();
  ctx.fillStyle = css("--arm"); ctx.beginPath(); ctx.arc(X(f), Y(u), (5 + 5 * D.grip[index]) * d, 0, 7); ctx.fill();
  ctx.fillStyle = css("--muted"); ctx.fillText(D.cue[index] ? `step: ${D.cue[index].replace("_", " ")}` : "", 6 * d, 14 * d);
}

function drawRobot() {
  const [ctx, w, h, d] = fit(document.getElementById("robot")); ctx.clearRect(0, 0, w, h);
  const s = Math.min(w / 0.5, h / 0.6), X = x => (x + 0.08) * s, Z = z => h - 26 * d - z * s;
  ctx.fillStyle = css("--safe"); ctx.globalAlpha = 0.35;
  ctx.fillRect(X(D.robot.forward_range_m[0]), Z(0), (D.robot.forward_range_m[1] - D.robot.forward_range_m[0]) * s, 6 * d);
  ctx.globalAlpha = 1; ctx.strokeStyle = css("--line"); ctx.lineWidth = 2 * d;
  ctx.beginPath(); ctx.moveTo(0, Z(0)); ctx.lineTo(w, Z(0)); ctx.stroke();
  ctx.fillStyle = css("--muted"); ctx.font = `${10 * d}px system-ui`; ctx.textAlign = "center";
  for (let cm = 0; cm <= 40; cm += 5) ctx.fillText(`${cm}`, X(cm / 100), Z(0) + 18 * d); ctx.textAlign = "left";
  ctx.fillStyle = css("--line"); ctx.fillRect(X(-0.05), Z(0.06), 0.1 * s, 0.06 * s); ctx.fillRect(X(0.01), Z(G.shoulder_height), 0.04 * s, (G.shoulder_height - 0.06) * s);
  for (const [a, color, lw, alpha] of [[D.executed[index], "--target", 4, 0.4], [D.angles[index], "--arm", 8, 1]]) {
    const pts = chain(a); ctx.globalAlpha = alpha; ctx.strokeStyle = css(color); ctx.lineWidth = lw * d; ctx.lineCap = "round"; ctx.lineJoin = "round";
    ctx.beginPath(); pts.forEach((p, i) => i ? ctx.lineTo(X(p[0]), Z(p[1])) : ctx.moveTo(X(p[0]), Z(p[1]))); ctx.stroke(); }
  ctx.globalAlpha = 1;
  const [tx, tz] = D.target[index];
  ctx.strokeStyle = css(D.moved[index] ? "--moved" : "--target"); ctx.lineWidth = 2.5 * d;
  ctx.beginPath(); ctx.arc(X(tx), Z(tz), 8 * d, 0, 7); ctx.stroke();
  ctx.fillStyle = css("--muted"); ctx.fillText(`shoulder load ${D.torque[index].toFixed(1)} kg·cm · grip ${(100 * D.grip[index]).toFixed(0)}%`, 6 * d, 14 * d);
}

function lane(id, values, targets, lo, hi) {
  const c = document.getElementById(id), [ctx, w, h, d] = fit(c); ctx.clearRect(0, 0, w, h);
  const X = i => i / (N - 1) * w, Y = v => h - (v - lo) / (hi - lo) * h;
  for (const [vals, color] of [[targets, "--target"], [values, "--arm"]]) { if (!vals) continue;
    ctx.strokeStyle = css(color); ctx.lineWidth = 1.5 * d; ctx.beginPath();
    vals.forEach((v, i) => i ? ctx.lineTo(X(i), Y(v)) : ctx.moveTo(X(i), Y(v))); ctx.stroke(); }
  ctx.strokeStyle = css("--muted"); ctx.lineWidth = d; ctx.beginPath(); ctx.moveTo(X(index), 0); ctx.lineTo(X(index), h); ctx.stroke();
  c.onclick = e => { const r = c.getBoundingClientRect(); index = Math.round((e.clientX - r.left) / r.width * (N - 1)); };
}
const tipX = D.tip.map(p => p[0] * 100), tipZ = D.tip.map(p => p[1] * 100);
const tgtX = D.target.map(p => p[0] * 100), tgtZ = D.target.map(p => p[1] * 100), grip = D.grip.map(g => g * 100);
const range = a => { const lo = Math.min(...a), hi = Math.max(...a), p = (hi - lo) * 0.1 || 1; return [lo - p, hi + p]; };
const [xl, xh] = range([...tipX, ...tgtX]), [zl, zh] = range([...tipZ, ...tgtZ]);

const scrub = document.getElementById("scrub"); scrub.max = N - 1; scrub.oninput = () => { index = +scrub.value; };
document.getElementById("play").onclick = e => { playing = !playing; e.target.textContent = playing ? "Pause" : "Play"; };
let last = performance.now(), acc = 0;
(function loop(now) {
  if (playing) { acc += now - last; while (acc >= D.dt * 1000) { acc -= D.dt * 1000; index = (index + 1) % N; } }
  last = now; scrub.value = index; document.getElementById("clock").textContent = `${(index * D.dt).toFixed(1)} s`;
  drawHuman(); drawRobot(); lane("lane-x", tipX, tgtX, xl, xh); lane("lane-z", tipZ, tgtZ, zl, zh); lane("lane-g", grip, null, 0, 100);
  requestAnimationFrame(loop);
})(performance.now());
</script>
</body>
</html>
